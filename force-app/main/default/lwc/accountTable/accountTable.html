<template>
  <lightning-card title="アカウント一覧" icon-name="standard:account">
    <template if:true={accounts}>
      <lightning-datatable
        key-field="Id"
        data={accounts}
        columns={columns}
        hide-checkbox-column
      >
      </lightning-datatable>
    </template>
    <template if:true={errors}>
      <div class="slds-text-color_error slds-m-around_medium">{errors}</div>
    </template>
  </lightning-card>
</template>
